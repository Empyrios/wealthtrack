<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10171c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Your finances, in focus. Private, GBP-first account tracking, spending, investing and savings goals.">
  <title>WealthTrack | Make money make sense.</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <a class="logo" href="#overview"><span class="logomark" aria-hidden="true">◈</span><span>wealth<span class="logo-accent">track</span><small>YOUR MONEY, CLEARLY</small></span></a>
    <div class="side-label">WORKSPACE</div>
    <nav id="side-nav" class="side-nav" aria-label="Sections"></nav>
    <div class="side-bottom"><div class="privacy-dot"></div><div><b>Local & private</b><span>Your data stays on this device.</span></div></div>
    <a class="backlink" href="https://empyrios.github.io/apphub/" target="_blank" rel="noopener noreferrer">↗ AppHub</a>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="top-left"><div class="mobile-symbol" aria-hidden="true">◈</div><div class="crumb"><span>WORKSPACE</span> / <b id="crumb-current">Overview</b></div></div>
      <div class="top-actions"><span class="sync-indicator"><i></i><span>On-device</span></span><button type="button" class="top-avatar" id="settings-open" title="Settings" aria-label="Open settings">WT</button></div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
</div>
<dialog id="dialog" aria-label="Edit financial item"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-input" accept="application/json,.json" hidden>
<script type="module" src="app.mjs"></script>
</body>
</html>
